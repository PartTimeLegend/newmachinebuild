name: CICD
permissions:
  contents: read
  pull-requests: write
on:
  push:
    paths-ignore:
    - "**.md"
    - ".mergify.yml"
    - "LICENSE"
    - ".github/CODEOWNERS"
    - ".github/PULL_REQUEST_TEMPLATE.md"
    - ".github/labeler.yml"
    - ".github/FUNDING.yml"
    - ".github/workflows/autoupdate.yml"
    - ".github/workflows/labeler.yml"
    - ".github/workflows/size-label.yml"
    branches: [ master ]
  pull_request:
    paths-ignore:
    - "**.md"
    - ".mergify.yml"
    - "LICENSE"
    - ".github/CODEOWNERS"
    - ".github/PULL_REQUEST_TEMPLATE.md"
    - ".github/labeler.yml"
    - ".github/FUNDING.yml"
    - ".github/workflows/autoupdate.yml"
    - ".github/workflows/labeler.yml"
    - ".github/workflows/size-label.yml"
    branches: [ master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  shell-lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout SHA
    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck
    - name: Shellcheck scripts
      run: shellcheck NewMachineSetup.sh unbrew.sh

  powershell-static:
    name: PowerShell static analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout SHA
    - name: Parse script syntax
      shell: pwsh
      run: |
        $errors = $null
        [System.Management.Automation.Language.Parser]::ParseFile('./NewMachineSetup.ps1', [ref]$null, [ref]$errors) | Out-Null
        if ($errors.Count -gt 0) {
          $errors | ForEach-Object { Write-Error $_ }
          exit 1
        }

  bash-qualification:
    name: Bash IQ/OQ gating (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [shell-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout SHA
    - name: Install Homebrew (Linux)
      if: runner.os == 'Linux'
      uses: ./.github/actions/setup-homebrew-linux
    - name: IQ gate
      run: |
        chmod +x ./NewMachineSetup.sh
        ./NewMachineSetup.sh --iq-only
    - name: OQ smoke test
      run: |
        chmod +x ./NewMachineSetup.sh
        ./NewMachineSetup.sh --oq-only

  powershell-qualification:
    name: PowerShell IQ/OQ gating
    runs-on: windows-latest
    needs: [powershell-static]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout SHA
    - name: IQ gate
      shell: pwsh
      run: ./NewMachineSetup.ps1 -IQOnly -SkipElevation
    - name: OQ smoke test
      shell: pwsh
      run: ./NewMachineSetup.ps1 -OQOnly -SkipElevation

  bash-validate-only:
    name: Bash validate-only benchmark (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    needs: [bash-qualification]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout SHA
    - name: Install Homebrew (Linux)
      if: runner.os == 'Linux'
      uses: ./.github/actions/setup-homebrew-linux
    - name: Combined validation benchmark
      run: |
        chmod +x ./NewMachineSetup.sh
        ./NewMachineSetup.sh --validate-only

  powershell-validate-only:
    name: PowerShell validate-only benchmark
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    needs: [powershell-qualification]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout SHA
    - name: Combined validation benchmark
      shell: pwsh
      run: ./NewMachineSetup.ps1 -ValidateOnly -SkipElevation

  tag:
    name: Tag Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [shell-lint, powershell-static, bash-qualification, powershell-qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout SHA
      with:
        fetch-depth: '0'
    - name: Bump version and push tag
      uses: anothrNick/github-tag-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: true
