name: CICD
permissions:
  contents: read
  pull-requests: write
on:
  push:
    paths-ignore:
    - "**.md"
    - ".mergify.yml"
    - "LICENSE"
    - ".github/CODEOWNERS"
    - ".github/PULL_REQUEST_TEMPLATE.md"
    - ".github/labeler.yml"
    - ".github/FUNDING.yml"
    - ".github/workflows/autoupdate.yml"
    - ".github/workflows/labeler.yml"
    - ".github/workflows/size-label.yml"
    branches: [ master ]
  pull_request:
    paths-ignore:
    - "**.md"
    - ".mergify.yml"
    - "LICENSE"
    - ".github/CODEOWNERS"
    - ".github/PULL_REQUEST_TEMPLATE.md"
    - ".github/labeler.yml"
    - ".github/FUNDING.yml"
    - ".github/workflows/autoupdate.yml"
    - ".github/workflows/labeler.yml"
    - ".github/workflows/size-label.yml"
    branches: [ master ]
  schedule:
    - cron:  '0 0 * * *'
  workflow_dispatch:

jobs:
  shell-lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck
    - name: Shellcheck scripts
      run: shellcheck NewMachineSetup.sh unbrew.sh

  powershell-static:
    name: PowerShell static analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Parse script syntax
      shell: pwsh
      run: |
        $errors = $null
        [System.Management.Automation.Language.Parser]::ParseFile('./NewMachineSetup.ps1', [ref]$null, [ref]$errors) | Out-Null
        if ($errors.Count -gt 0) {
          $errors | ForEach-Object { Write-Error $_ }
          exit 1
        }
    - name: Run script analyzer
      shell: pwsh
      run: |
        Set-PSRepository PSGallery -InstallationPolicy Trusted
        Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
        Invoke-ScriptAnalyzer -Path ./NewMachineSetup.ps1 -Severity Warning -EnableExit

  smoke-tests:
    name: Script smoke tests
    runs-on: ubuntu-latest
    needs: [shell-lint, powershell-static]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Bash validate-only smoke test
      run: |
        chmod +x ./NewMachineSetup.sh
        ./NewMachineSetup.sh --validate-only
    - name: PowerShell validate-only smoke test
      shell: pwsh
      run: ./NewMachineSetup.ps1 -ValidateOnly -SkipElevation

  tag:
    name: Tag Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [shell-lint, powershell-static, smoke-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: '0'
    - name: Bump version and push tag
      uses: anothrNick/github-tag-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: true
